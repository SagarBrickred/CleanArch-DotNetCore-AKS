# Federated identity for Azure Workload Identity — binds the pod's K8s ServiceAccount
# to an Azure AD Managed Identity that has "get secrets" access on the Key Vault, and
# nothing else (least privilege). No client secrets or certs are stored anywhere.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cleanarch-api-sa
  namespace: cleanarch-prod
  annotations:
    azure.workload.identity/client-id: "<MANAGED_IDENTITY_CLIENT_ID>"   # set via pipeline variable substitution
  labels:
    azure.workload.identity/use: "true"
