# Azure Key Vault CSI driver — mounts secrets as files AND syncs them into a K8s Secret,
# so both file-based and env-var-based consumption work without the app ever calling
# Key Vault directly for these values (defense in depth alongside Program.cs's AddAzureKeyVault).
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: cleanarch-keyvault-secrets
  namespace: cleanarch-prod
spec:
  provider: azure
  secretObjects:
    - secretName: cleanarch-api-secrets
      type: Opaque
      data:
        - objectName: SqlConnectionString
          key: ConnectionStrings--DefaultConnection
        - objectName: AppInsightsConnectionString
          key: ApplicationInsights--ConnectionString
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: "<MANAGED_IDENTITY_CLIENT_ID>"
    keyvaultName: "kv-cleanarch-prod"
    tenantId: "<AZURE_TENANT_ID>"
    objects: |
      array:
        - |
          objectName: SqlConnectionString
          objectType: secret
        - |
          objectName: AppInsightsConnectionString
          objectType: secret
