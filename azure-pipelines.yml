trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

variables:
  azureServiceConnection: 'sc-cleanarch-prod'
  resourceGroup: 'rg-order-dev'

  stagingWebApp: 'app-cleanarch-dev-staging'
  productionWebApp: 'app-cleanarch-dev-prod'

  acrName: 'acrcleanarchdev01'
  imageRepository: 'cleanarch-api'
  dockerRegistry: 'acrcleanarchdev01.azurecr.io'

stages:

# ============================================================
# 1. BUILD AND TEST
# ============================================================
- stage: Build
  displayName: 'Build and Test'

  jobs:
  - job: BuildAndTest
    displayName: 'Build .NET 8 Application'

    pool:
      vmImage: 'ubuntu-latest'

    steps:

    - checkout: self

    - task: UseDotNet@2
      displayName: 'Install .NET 8 SDK'
      inputs:
        packageType: 'sdk'
        version: '8.x'

    - script: |
        set -e
        dotnet restore CleanArchSolution.sln
      displayName: 'Restore NuGet packages'

    - script: |
        set -e
        dotnet build CleanArchSolution.sln \
          --configuration Release \
          --no-restore
      displayName: 'Build solution'

    - script: |
        set -e
        dotnet test CleanArchSolution.sln \
          --configuration Release \
          --no-build \
          --verbosity normal
      displayName: 'Run tests'


# ============================================================
# 2. BUILD AND PUSH DOCKER IMAGE
# ============================================================
- stage: Docker
  displayName: 'Build and Push Docker Image'

  dependsOn: Build
  condition: succeeded()

  jobs:
  - job: DockerBuild
    displayName: 'Build and Push Image'

    pool:
      vmImage: 'ubuntu-latest'

    steps:

    - checkout: self

    - task: AzureCLI@2
      displayName: 'Build and Push Image to ACR'

      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'

        inlineScript: |

          set -e

          IMAGE="$(dockerRegistry)/$(imageRepository):$(Build.BuildId)"

          echo "========================================"
          echo "Azure subscription"
          echo "========================================"

          az account show \
            --query "{subscription:id,tenant:tenantId}" \
            -o table

          echo "========================================"
          echo "Logging into ACR"
          echo "========================================"

          az acr login \
            --name "$(acrName)"

          echo "========================================"
          echo "Building Docker image"
          echo "$IMAGE"
          echo "========================================"

          docker build \
            --pull \
            -t "$IMAGE" \
            .

          echo "========================================"
          echo "Pushing Docker image"
          echo "========================================"

          docker push "$IMAGE"

          echo "========================================"
          echo "Image successfully pushed"
          echo "$IMAGE"
          echo "========================================"


# ============================================================
# 3. DEPLOY TO STAGING APP SERVICE
# ============================================================
- stage: DeployStaging
  displayName: 'Deploy to Staging App Service'

  dependsOn: Docker
  condition: succeeded()

  jobs:

  - deployment: DeployToStaging
    displayName: 'Deploy CleanArch API to Staging'

    environment: 'cleanarch-staging'

    pool:
      vmImage: 'ubuntu-latest'

    strategy:
      runOnce:
        deploy:

          steps:

          - checkout: self

          - task: AzureCLI@2
            displayName: 'Deploy Container to Staging App Service'

            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'

              inlineScript: |

                set -e

                IMAGE="$(dockerRegistry)/$(imageRepository):$(Build.BuildId)"

                echo "========================================"
                echo "Deploying image to Staging"
                echo "$IMAGE"
                echo "========================================"

                az webapp config container set \
                  --resource-group "$(resourceGroup)" \
                  --name "$(stagingWebApp)" \
                  --container-image-name "$IMAGE"

                echo "========================================"
                echo "Restarting Staging App Service"
                echo "========================================"

                az webapp restart \
                  --resource-group "$(resourceGroup)" \
                  --name "$(stagingWebApp)"

                echo "========================================"
                echo "Verifying deployed image"
                echo "========================================"

                DEPLOYED_IMAGE=$(az webapp config container show \
                  --resource-group "$(resourceGroup)" \
                  --name "$(stagingWebApp)" \
                  --query "[?name=='DOCKER_CUSTOM_IMAGE_NAME'].value | [0]" \
                  -o tsv)

                echo "Expected image:"
                echo "DOCKER|$IMAGE"

                echo "Actual image:"
                echo "$DEPLOYED_IMAGE"

                if [ "$DEPLOYED_IMAGE" != "DOCKER|$IMAGE" ]; then
                  echo "ERROR: Staging App Service image does not match expected image."
                  exit 1
                fi

                echo "========================================"
                echo "Staging deployment successful"
                echo "========================================"


# ============================================================
# 4. STAGING SMOKE TEST
# ============================================================
- stage: SmokeTestStaging
  displayName: 'Smoke Test Staging App Service'

  dependsOn: DeployStaging
  condition: succeeded()

  jobs:

  - job: StagingHealthCheck
    displayName: 'Validate Staging API'

    pool:
      vmImage: 'ubuntu-latest'

    steps:

    - checkout: self

    - task: AzureCLI@2
      displayName: 'Validate Staging Health Endpoints'

      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'

        inlineScript: |

          set -e

          echo "========================================"
          echo "Getting Staging App Service hostname"
          echo "========================================"

          HOSTNAME=$(az webapp show \
            --resource-group "$(resourceGroup)" \
            --name "$(stagingWebApp)" \
            --query "defaultHostName" \
            -o tsv)

          echo "Staging hostname:"
          echo "$HOSTNAME"

          if [ -z "$HOSTNAME" ]; then
            echo "ERROR: Could not determine Staging App Service hostname."
            exit 1
          fi

          echo "========================================"
          echo "Testing DNS resolution"
          echo "========================================"

          getent hosts "$HOSTNAME"

          echo "========================================"
          echo "Testing TCP 443 connectivity"
          echo "========================================"

          if timeout 10 bash -c "</dev/tcp/$HOSTNAME/443"; then
            echo "TCP 443 reachable"
          else
            echo "TCP 443 NOT reachable"
          fi

          echo "========================================"
          echo "Testing /health/live"
          echo "========================================"

          curl --fail --silent --show-error \
            --max-time 30 \
            "https://$HOSTNAME/health/live"

          echo
          echo "========================================"
          echo "Testing /health/ready"
          echo "========================================"

          curl --fail --silent --show-error \
            --max-time 30 \
            "https://$HOSTNAME/health/ready"

          echo
          echo "========================================"
          echo "Testing /health/startup"
          echo "========================================"

          curl --fail --silent --show-error \
            --max-time 30 \
            "https://$HOSTNAME/health/startup"

          echo
          echo "========================================"
          echo "Staging smoke test successful"
          echo "========================================"

# ============================================================
# 5. DEPLOY TO PRODUCTION APP SERVICE
# ============================================================
- stage: DeployProduction
  displayName: 'Deploy to Production App Service'

  dependsOn: SmokeTestStaging
  condition: succeeded()

  jobs:

  - deployment: DeployToProduction
    displayName: 'Deploy CleanArch API to Production'

    environment: 'cleanarch-production'

    pool:
      vmImage: 'ubuntu-latest'

    strategy:
      runOnce:
        deploy:

          steps:

          - checkout: self

          - task: AzureCLI@2
            displayName: 'Deploy Container to Production App Service'

            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'

              inlineScript: |

                set -e

                IMAGE="$(dockerRegistry)/$(imageRepository):$(Build.BuildId)"

                echo "========================================"
                echo "Deploying image to Production"
                echo "$IMAGE"
                echo "========================================"

                az webapp config container set \
                  --resource-group "$(resourceGroup)" \
                  --name "$(productionWebApp)" \
                  --container-image-name "$IMAGE"

                echo "========================================"
                echo "Restarting Production App Service"
                echo "========================================"

                az webapp restart \
                  --resource-group "$(resourceGroup)" \
                  --name "$(productionWebApp)"

                echo "========================================"
                echo "Verifying deployed image"
                echo "========================================"

                DEPLOYED_IMAGE=$(az webapp config container show \
                  --resource-group "$(resourceGroup)" \
                  --name "$(productionWebApp)" \
                  --query "[?name=='DOCKER_CUSTOM_IMAGE_NAME'].value | [0]" \
                  -o tsv)

                echo "Expected image:"
                echo "DOCKER|$IMAGE"

                echo "Actual image:"
                echo "$DEPLOYED_IMAGE"

                if [ "$DEPLOYED_IMAGE" != "DOCKER|$IMAGE" ]; then
                  echo "ERROR: Production App Service image does not match expected image."
                  exit 1
                fi

                echo "========================================"
                echo "Production deployment successful"
                echo "========================================"
# ============================================================
# 6. PRODUCTION SMOKE TEST
# ============================================================
- stage: SmokeTestProduction
  displayName: 'Smoke Test Production App Service'

  dependsOn: DeployProduction
  condition: succeeded()

  jobs:

  - job: ProductionHealthCheck
    displayName: 'Validate Production API'

    pool:
      vmImage: 'ubuntu-latest'

    steps:

    - checkout: self

    - task: AzureCLI@2
      displayName: 'Validate Production Health Endpoints'

      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'

        inlineScript: |

          set -e

          echo "========================================"
          echo "Getting Production App Service hostname"
          echo "========================================"

          HOSTNAME=$(az webapp show \
            --resource-group "$(resourceGroup)" \
            --name "$(productionWebApp)" \
            --query "defaultHostName" \
            -o tsv)

          echo "Production hostname:"
          echo "$HOSTNAME"

          if [ -z "$HOSTNAME" ]; then
            echo "ERROR: Could not determine Production App Service hostname."
            exit 1
          fi

          echo "========================================"
          echo "Testing /health/live"
          echo "========================================"

          curl --fail --silent --show-error \
            --max-time 30 \
            "https://$HOSTNAME/health/live"

          echo
          echo "========================================"
          echo "Testing /health/ready"
          echo "========================================"

          curl --fail --silent --show-error \
            --max-time 30 \
            "https://$HOSTNAME/health/ready"

          echo
          echo "========================================"
          echo "Testing /health/startup"
          echo "========================================"

          curl --fail --silent --show-error \
            --max-time 30 \
            "https://$HOSTNAME/health/startup"

          echo
          echo "========================================"
          echo "Production smoke test successful"
          echo "========================================"
