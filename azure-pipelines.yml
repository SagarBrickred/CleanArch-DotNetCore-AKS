trigger:
branches:
include:
- main

pr:
branches:
include:
- main

variables:
azureServiceConnection: 'sc-cleanarch-prod'
resourceGroup: 'rg-cleanarch-prod'
aksCluster: 'aks-cleanarch-prod01'
aksNamespace: 'cleanarch'

acrName: 'acrcleanarchprod01'
imageRepository: 'cleanarch-api'
dockerRegistry: 'acrcleanarchprod01.azurecr.io'

stages:

# ============================================================

# 1. BUILD AND TEST

# ============================================================

* stage: Build
  displayName: 'Build and Test'

  jobs:

  * job: BuildAndTest
    displayName: 'Build .NET 8 Application'

    pool:
    vmImage: 'ubuntu-latest'

    steps:

    * checkout: self

    * task: UseDotNet@2
      displayName: 'Install .NET 8 SDK'
      inputs:
      packageType: 'sdk'
      version: '8.x'

    * script: |
      set -euo pipefail

      echo "========================================"
      echo "Restoring solution"
      echo "========================================"

      dotnet restore CleanArchSolution.sln
      displayName: 'Restore NuGet packages'

    * script: |
      set -euo pipefail

      echo "========================================"
      echo "Building solution"
      echo "========================================"

      dotnet build CleanArchSolution.sln 
      --configuration Release 
      --no-restore
      displayName: 'Build solution'

    * script: |
      set -euo pipefail

      echo "========================================"
      echo "Running tests"
      echo "========================================"

      dotnet test CleanArchSolution.sln 
      --configuration Release 
      --no-build 
      --verbosity normal
      displayName: 'Run tests'

# ============================================================

# 2. BUILD AND PUSH DOCKER IMAGE

# ============================================================

* stage: Docker
  displayName: 'Build and Push Docker Image'

  dependsOn: Build
  condition: succeeded()

  jobs:

  * job: DockerBuild
    displayName: 'Build and Push Image'

    pool:
    vmImage: 'ubuntu-latest'

    steps:

    * checkout: self

    * task: AzureCLI@2
      displayName: 'Build and Push Image to ACR'

      inputs:
      azureSubscription: '$(azureServiceConnection)'
      scriptType: 'bash'
      scriptLocation: 'inlineScript'

      inlineScript: |

      ```
      set -euo pipefail

      IMAGE="$(dockerRegistry)/$(imageRepository):$(Build.BuildId)"

      echo "========================================"
      echo "Azure subscription"
      echo "========================================"

      az account show \
        --query "{subscription:id,tenant:tenantId}" \
        -o table

      echo "========================================"
      echo "Logging into ACR"
      echo "========================================"

      az acr login \
        --name "$(acrName)"

      echo "========================================"
      echo "Building Docker image"
      echo "$IMAGE"
      echo "========================================"

      docker build \
        --pull \
        -t "$IMAGE" \
        .

      echo "========================================"
      echo "Pushing Docker image"
      echo "========================================"

      docker push "$IMAGE"

      echo "========================================"
      echo "Verifying image"
      echo "========================================"

      az acr repository show \
        --name "$(acrName)" \
        --image "$(imageRepository):$(Build.BuildId)" \
        -o table

      echo "========================================"
      echo "IMAGE PUSH SUCCESSFUL"
      echo "$IMAGE"
      echo "========================================"
      ```

# ============================================================

# 3. DEPLOY TO AKS

# ============================================================

* stage: Deploy
  displayName: 'Deploy to AKS'

  dependsOn: Docker
  condition: succeeded()

  jobs:

  * deployment: DeployToAKS
    displayName: 'Deploy CleanArch API'

    environment: 'cleanarch-production'

    pool:
    vmImage: 'ubuntu-latest'

    strategy:
    runOnce:
    deploy:

    ```
      steps:

      - checkout: self

      - task: AzureCLI@2
        displayName: 'Deploy Kubernetes Resources'

        inputs:
          azureSubscription: '$(azureServiceConnection)'
          scriptType: 'bash'
          scriptLocation: 'inlineScript'

          inlineScript: |

            set -euo pipefail

            IMAGE="$(dockerRegistry)/$(imageRepository):$(Build.BuildId)"

            echo "========================================"
            echo "Connecting to AKS"
            echo "========================================"

            az aks get-credentials \
              --resource-group "$(resourceGroup)" \
              --name "$(aksCluster)" \
              --overwrite-existing

            kubectl cluster-info

            echo "========================================"
            echo "Applying Namespace"
            echo "========================================"

            kubectl apply \
              -f k8s/00-namespace.yaml

            echo "========================================"
            echo "Applying ServiceAccount"
            echo "========================================"

            kubectl apply \
              -f k8s/01-serviceaccount.yaml

            echo "========================================"
            echo "Applying ResourceQuota"
            echo "========================================"

            kubectl apply \
              -f k8s/09-resourcequota.yaml

            echo "========================================"
            echo "Applying SecretProviderClass"
            echo "========================================"

            kubectl apply \
              -f k8s/02-secretproviderclass.yaml

            echo "========================================"
            echo "Applying Deployment"
            echo "========================================"

            kubectl apply \
              -f k8s/04-deployment.yaml

            echo "========================================"
            echo "Applying Service"
            echo "========================================"

            kubectl apply \
              -f k8s/05-service.yaml

            echo "========================================"
            echo "Applying HPA"
            echo "========================================"

            kubectl apply \
              -f k8s/07-hpa.yaml

            echo "========================================"
            echo "Applying PDB"
            echo "========================================"

            kubectl apply \
              -f k8s/08-pdb.yaml

            echo "========================================"
            echo "Updating image"
            echo "$IMAGE"
            echo "========================================"

            kubectl -n "$(aksNamespace)" set image \
              deployment/cleanarch-api \
              cleanarch-api="$IMAGE"

            echo "========================================"
            echo "Waiting for rollout"
            echo "========================================"

            if kubectl -n "$(aksNamespace)" rollout status \
              deployment/cleanarch-api \
              --timeout=5m
            then

              echo "========================================"
              echo "ROLLOUT SUCCESSFUL"
              echo "========================================"

            else

              echo "========================================"
              echo "ROLLOUT FAILED"
              echo "Collecting diagnostics"
              echo "========================================"

              kubectl -n "$(aksNamespace)" get pods -o wide || true

              kubectl -n "$(aksNamespace)" describe deployment \
                cleanarch-api || true

              kubectl -n "$(aksNamespace)" get events \
                --sort-by='.lastTimestamp' || true

              kubectl -n "$(aksNamespace)" rollout history \
                deployment/cleanarch-api || true

              echo "========================================"
              echo "Rolling back deployment"
              echo "========================================"

              kubectl -n "$(aksNamespace)" rollout undo \
                deployment/cleanarch-api

              echo "========================================"
              echo "Waiting for rollback"
              echo "========================================"

              kubectl -n "$(aksNamespace)" rollout status \
                deployment/cleanarch-api \
                --timeout=5m

              echo "========================================"
              echo "ROLLBACK COMPLETED"
              echo "Failing pipeline"
              echo "========================================"

              exit 1

            fi

            echo "========================================"
            echo "Deployment"
            echo "========================================"

            kubectl -n "$(aksNamespace)" get deployment \
              cleanarch-api

            echo "========================================"
            echo "Pods"
            echo "========================================"

            kubectl -n "$(aksNamespace)" get pods \
              -l app=cleanarch-api \
              -o wide

            echo "========================================"
            echo "HPA"
            echo "========================================"

            kubectl -n "$(aksNamespace)" get hpa \
              cleanarch-api-hpa

            echo "========================================"
            echo "PDB"
            echo "========================================"

            kubectl -n "$(aksNamespace)" get pdb \
              cleanarch-api-pdb

            echo "========================================"
            echo "ResourceQuota"
            echo "========================================"

            kubectl -n "$(aksNamespace)" get resourcequota \
              cleanarch-prod-quota

            echo "========================================"
            echo "Service"
            echo "========================================"

            kubectl -n "$(aksNamespace)" get service \
              cleanarch-api-svc

            echo "========================================"
            echo "AKS DEPLOYMENT SUCCESSFUL"
            echo "========================================"
    ```

# ============================================================

# 4. SMOKE TEST

# ============================================================

* stage: SmokeTest
  displayName: 'Smoke Test'

  dependsOn: Deploy
  condition: succeeded()

  jobs:

  * job: HealthCheck
    displayName: 'API Health Check'

    pool:
    vmImage: 'ubuntu-latest'

    steps:

    * checkout: self

    * task: AzureCLI@2
      displayName: 'Validate API Health'

      inputs:
      azureSubscription: '$(azureServiceConnection)'
      scriptType: 'bash'
      scriptLocation: 'inlineScript'

      inlineScript: |

      ```
      set -euo pipefail

      SMOKE_POD="cleanarch-smoke-test-$(Build.BuildId)"

      cleanup() {
        echo "========================================"
        echo "Cleaning up smoke test pod"
        echo "========================================"

        kubectl -n "$(aksNamespace)" delete pod \
          "$SMOKE_POD" \
          --ignore-not-found=true
      }

      trap cleanup EXIT

      echo "========================================"
      echo "Getting AKS credentials"
      echo "========================================"

      az aks get-credentials \
        --resource-group "$(resourceGroup)" \
        --name "$(aksCluster)" \
        --overwrite-existing

      echo "========================================"
      echo "Checking deployment"
      echo "========================================"

      kubectl -n "$(aksNamespace)" get deployment \
        cleanarch-api

      echo "========================================"
      echo "Checking pods"
      echo "========================================"

      kubectl -n "$(aksNamespace)" get pods \
        -l app=cleanarch-api \
        -o wide

      echo "========================================"
      echo "Checking pod readiness"
      echo "========================================"

      POD_COUNT=$(kubectl -n "$(aksNamespace)" get pods \
        -l app=cleanarch-api \
        --no-headers 2>/dev/null | wc -l)

      if [ "$POD_COUNT" -eq 0 ]; then
        echo "No API pods found."
        exit 1
      fi

      READY=$(kubectl -n "$(aksNamespace)" get pods \
        -l app=cleanarch-api \
        -o jsonpath='{range .items[*]}{.status.conditions[?(@.type=="Ready")].status}{"\n"}{end}')

      echo "Pod readiness:"
      echo "$READY"

      READY_COUNT=$(echo "$READY" | grep -c '^True$' || true)

      if [ "$READY_COUNT" -ne "$POD_COUNT" ]; then
        echo "One or more API pods are not Ready."
        exit 1
      fi

      echo "All API pods are Ready."

      echo "========================================"
      echo "Testing ClusterIP service"
      echo "========================================"

      kubectl -n "$(aksNamespace)" get service \
        cleanarch-api-svc

      echo "========================================"
      echo "Creating smoke test pod"
      echo "========================================"

      kubectl -n "$(aksNamespace)" run \
        "$SMOKE_POD" \
        --restart=Never \
        --image=curlimages/curl:8.10.1 \
        --requests='cpu=10m,memory=16Mi' \
        --limits='cpu=50m,memory=32Mi' \
        --command \
        -- curl \
          --fail \
          --silent \
          --show-error \
          --max-time 10 \
          http://cleanarch-api-svc/health/ready

      echo "========================================"
      echo "Waiting for smoke test completion"
      echo "========================================"

      if kubectl -n "$(aksNamespace)" wait \
        --for=jsonpath='{.status.phase}'=Succeeded \
        pod/"$SMOKE_POD" \
        --timeout=60s
      then

        echo "========================================"
        echo "Smoke test pod succeeded"
        echo "========================================"

      else

        echo "========================================"
        echo "SMOKE TEST POD FAILED"
        echo "========================================"

        kubectl -n "$(aksNamespace)" get pod \
          "$SMOKE_POD" \
          -o wide || true

        kubectl -n "$(aksNamespace)" logs \
          "$SMOKE_POD" || true

        exit 1

      fi

      echo "========================================"
      echo "SMOKE TEST PASSED"
      echo "========================================"
      ```
